# Автоотмена брошенных заказов каждые 10 минут.
#
# Зачем: на тарифе Vercel Hobby крон-задачи запускаются не чаще раза в сутки
# (и не более 2 задач), поэтому vercel.json содержит только суточный «страховочный»
# запуск. Частый ритм, который нужен магазину, даёт этот workflow — он бесплатный
# на публичных репозиториях и не требует Pro-плана.
#
# Что настроить в GitHub (Settings → Secrets and variables → Actions):
#   Variables: APP_URL       — например https://gorn-shop.vercel.app (без слэша в конце)
#   Secrets:   CRON_SECRET   — тот же секрет, что в переменных окружения Vercel
#
# Пока APP_URL не задан, workflow не выполняется (guard в `if`), а не падает
# каждые 10 минут. Ручной запуск: Actions → expire-orders → Run workflow.
name: expire-orders

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

concurrency:
  group: expire-orders
  cancel-in-progress: false

permissions: {}

jobs:
  call-cron:
    if: ${{ vars.APP_URL != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: POST/GET /api/cron/expire-orders
        env:
          APP_URL: ${{ vars.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "${CRON_SECRET}" ]; then
            echo "::error::Не задан secret CRON_SECRET — пропускаю"
            exit 1
          fi
          # --fail: 4xx/5xx считаются ошибкой и видны в Actions;
          # --retry: короткие сетевые сбои и «холодный» старт Vercel.
          curl --fail --silent --show-error --retry 3 --retry-delay 5 --max-time 120 \
            -H "Authorization: Bearer ${CRON_SECRET}" \
            "${APP_URL%/}/api/cron/expire-orders"
